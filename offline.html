<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SilentVoice X Offline Setup</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#f7fbff;font-family:system-ui,sans-serif;padding:20px}.card{max-width:600px;background:#0d1b2e;border:1px solid #1c3a5d;border-radius:24px;padding:24px}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:900;color:white;background:#173554;cursor:pointer}.primary{background:linear-gradient(135deg,#0ea5e9,#7c3aed)}.row{display:flex;gap:10px;flex-wrap:wrap}.status{margin:16px 0;color:#9bb0c9;line-height:1.5}</style></head><body><div class="card"><h1>📴 SilentVoice X Offline Setup</h1><p>Prepare the stable Build 15 app while online. Your samples and trained model remain in this browser.</p><div id="status" class="status">Ready to prepare offline mode.</div><div class="row"><button id="prepare" class="btn primary">Prepare Offline Mode</button><button id="open" class="btn">Open SilentVoice X</button></div><script>const st=document.getElementById('status');document.getElementById('open').onclick=()=>location.href='./index.html';document.getElementById('prepare').onclick=async()=>{try{st.textContent='Preparing offline files…';await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;for(const u of ['./','./index.html','./offline.html','https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js','https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm','https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task']){try{await fetch(u,{cache:'reload'})}catch(_){}}localStorage.setItem('svx-offline-prepared','1');st.textContent='✓ Offline mode prepared. Open the app and start the camera once while online, then test offline.'}catch(e){st.textContent='Offline setup error: '+e.message}};</script></div></body></html>
