name: Fix early stopping training
on:
  push:
    paths:
      - '.github/workflows/fix-early-stopping.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply early stopping compatibility fix
        run: python scripts/fix_early_stopping.py
      - name: Validate browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          code=re.sub(r'^import .*?;\s*','',m.group(1),count=1,flags=re.M)
          p=Path('/tmp/svx-module.mjs'); p.write_text(code)
          subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix TensorFlow early stopping compatibility'
          git push
