name: Fix training and cloud sync

on:
  push:
    paths:
      - '.github/workflows/fix-training-cloud-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply training fix
        run: python .github/scripts/fix-training-cloud-v2.py
      - name: Validate browser code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          js=js.replace('import {HandLandmarker, FilesetResolver, DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";','const HandLandmarker={}, FilesetResolver={}, DrawingUtils=function(){};')
          Path('/tmp/app.mjs').write_text(js)
          PY
          node --check /tmp/app.mjs
          node --check sync-backend/server.js
          grep -q 'BUILD 15 • AUTO SPEAK 70%' index.html
          grep -q 'conf>=0.70' index.html
          grep -q 'const EPOCHS=15;' index.html
          grep -q 'svx-cloud-model-dirty' index.html
          grep -q 'pendingLabels' index.html
      - name: Commit fix
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sync-backend/server.js
          git commit -m 'Fix mobile training and set auto speak to 70 percent'
          git push
