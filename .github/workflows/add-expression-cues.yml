name: Add face privacy toggle

on:
  push:
    paths:
      - '.github/workflows/add-expression-cues.yml'
      - 'scripts/add_face_privacy_toggle.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add local-only face privacy toggle
        run: python scripts/add_face_privacy_toggle.py
      - name: Commit face privacy toggle
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Add local-only face privacy toggle" || exit 0
          git push
