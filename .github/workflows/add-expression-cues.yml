name: Validate sign-only offline build

on:
  push:
    paths:
      - '.github/workflows/add-expression-cues.yml'
      - 'scripts/fix_sign_only_build.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean retired facial-expression code
        run: python scripts/fix_sign_only_build.py
      - name: Validate browser module syntax
        run: node --check /tmp/svx-app.mjs
      - name: Commit validated sign-only build
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix and validate sign-only SilentVoiceX build" || exit 0
          git push