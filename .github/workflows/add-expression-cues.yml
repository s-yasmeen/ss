name: Add confidence scale

on:
  push:
    paths:
      - '.github/workflows/add-expression-cues.yml'
      - 'scripts/add_confidence_scale.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 80 to 100 confidence scale
        run: python scripts/add_confidence_scale.py
      - name: Commit confidence scale
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Add adjustable 80 to 100 confidence scale" || exit 0
          git push
