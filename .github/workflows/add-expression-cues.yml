name: Add privacy face mesh

on:
  push:
    paths:
      - '.github/workflows/add-expression-cues.yml'
      - 'scripts/add_face_mesh.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add privacy-safe face mesh
        run: python scripts/add_face_mesh.py
      - name: Commit face mesh
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Show privacy-safe facial landmarks" || exit 0
          git push
