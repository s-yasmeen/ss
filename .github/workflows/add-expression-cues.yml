name: Add offline setup button

on:
  push:
    paths:
      - '.github/workflows/add-expression-cues.yml'
      - 'scripts/add_offline_header_button.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add prominent offline setup button
        run: python scripts/add_offline_header_button.py
      - name: Commit offline setup button
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Add prominent offline setup button" || exit 0
          git push
