name: Add expression cues

on:
  push:
    paths:
      - '.github/workflows/add-expression-cues.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply expression feature
        run: python scripts/add_expression.py
      - name: Commit feature
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js offline.html
          git commit -m "Add privacy-preserving facial expression cues" || exit 0
          git push
