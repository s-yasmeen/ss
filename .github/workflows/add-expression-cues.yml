name: Sign-only offline refactor

on:
  push:
    paths:
      - '.github/workflows/add-expression-cues.yml'
      - 'scripts/sign_only_offline.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert SilentVoiceX to sign-only offline AI
        run: python scripts/sign_only_offline.py
      - name: Commit sign-only build
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js offline.html
          git commit -m "Refocus SilentVoiceX on offline sign recognition" || exit 0
          git push