name: Reduce training samples

on:
  push:
    paths:
      - 'scripts/reduce_training_samples.py'
      - '.github/workflows/reduce-training-samples.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce sample minimum
        run: python scripts/reduce_training_samples.py
      - name: Validate browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not m: raise SystemExit('module script not found')
          js=m.group(1)
          js=re.sub(r'^import .*?;\s*$', '', js, flags=re.M)
          p=Path('/tmp/svx-check.js'); p.write_text(js, encoding='utf-8')
          subprocess.run(['node','--check',str(p)], check=True)
          PY
      - name: Commit reduced training requirement
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Reduce minimum training samples to six per sign" || exit 0
          git push
