name: Build robust offline runtime

on:
  push:
    paths:
      - '.github/workflows/vendor-offline-runtime.yml'
      - 'scripts/vendor_offline_runtime.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor pinned browser AI runtime
        run: |
          set -euxo pipefail
          mkdir -p vendor/wasm vendor/models
          curl -fL 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js' -o vendor/tf.min.js
          curl -fL 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm' -o vendor/tasks-vision.mjs
          curl -fL 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm/vision_wasm_internal.js' -o vendor/wasm/vision_wasm_internal.js
          curl -fL 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm/vision_wasm_internal.wasm' -o vendor/wasm/vision_wasm_internal.wasm
          curl -fL 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm/vision_wasm_nosimd_internal.js' -o vendor/wasm/vision_wasm_nosimd_internal.js
          curl -fL 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm/vision_wasm_nosimd_internal.wasm' -o vendor/wasm/vision_wasm_nosimd_internal.wasm
          curl -fL 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' -o vendor/models/hand_landmarker.task

      - name: Patch application for local runtime
        run: python scripts/vendor_offline_runtime.py

      - name: Validate browser code and downloaded files
        run: |
          node --check /tmp/svx-app.mjs
          node --check vendor/tasks-vision.mjs
          test $(stat -c%s vendor/tf.min.js) -gt 1000
          test $(stat -c%s vendor/tasks-vision.mjs) -gt 1000
          test $(stat -c%s vendor/wasm/vision_wasm_internal.wasm) -gt 1000
          test $(stat -c%s vendor/models/hand_landmarker.task) -gt 1000

      - name: Commit local offline runtime
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html offline.html sw.js vendor
          git commit -m 'Make SilentVoiceX runtime self-hosted and offline reliable' || exit 0
          git push