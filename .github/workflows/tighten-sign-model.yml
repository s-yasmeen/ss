name: Tighten sign model
on:
  push:
    paths:
      - 'scripts/tighten_sign_model.py'
      - '.github/workflows/tighten-sign-model.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply stronger multi-sign training and offline UI
        run: python scripts/tighten_sign_model.py
      - name: Validate browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          if not m: raise SystemExit('module script not found')
          js=m.group(1)
          js=re.sub(r'^import .*?;\s*','',js,count=1,flags=re.M)
          Path('/tmp/svx.mjs').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/svx.mjs
          grep -q 'MIN_TRAIN_PER_SIGN=8' index.html
          grep -q 'filters:64' index.html
          grep -q 'Offline Setup' index.html
          grep -q 'silentvoicex-accuracy-offline-v5' sw.js
      - name: Commit accuracy build
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Tighten multi-sign training accuracy and restore offline option'
          git push
