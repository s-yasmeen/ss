name: Enable camera privacy

on:
  push:
    paths:
      - '.github/workflows/enable-camera-privacy.yml'
      - 'scripts/enable_camera_privacy.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply always-on camera privacy
        run: python scripts/enable_camera_privacy.py
      - name: Validate browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script type="module">(.*?)</script>',s,re.S)
          if len(scripts)!=1:
              raise SystemExit('Expected one module script')
          Path('/tmp/svx-app.mjs').write_text(scripts[0])
          PY
          node --check /tmp/svx-app.mjs
      - name: Commit camera privacy build
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html offline.html sw.js
          git commit -m "Enable always-on camera privacy" || exit 0
          git push
