name: Set landmark thresholds 0.50

on:
  push:
    paths:
      - '.github/workflows/set-landmark-thresholds-05.yml'
      - 'scripts/set_landmark_thresholds_05.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set all hand-landmark thresholds to 0.50
        run: python scripts/set_landmark_thresholds_05.py
      - name: Validate browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script type="module">(.*?)</script>', s, re.S)
          if len(scripts)!=1:
              raise SystemExit('Expected one module script')
          Path('/tmp/svx-app.mjs').write_text(scripts[0])
          PY
          node --check /tmp/svx-app.mjs
      - name: Commit landmark threshold update
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Set hand landmark thresholds to 0.50' || exit 0
          git push
