name: Portable cumulative training

on:
  push:
    branches:
      - portable-training-work
    paths:
      - '.github/workflows/portable-cumulative-training.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portable cumulative training
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          def rep(old,new,name):
              global s
              if old not in s:
                  raise SystemExit(f'Missing expected marker: {name}')
              s=s.replace(old,new,1)

          old_note='''        <p class="note"><b>Important:</b> every participant should record the <b>same sign labels</b>. Example: P001 records HELLO, GOOD, HEART; P002 records HELLO, GOOD, HEART; P003 records HELLO, GOOD, HEART. Use P003 only as the unseen test signer.</p>'''
          new_note=old_note+'''\n        <div class="controls"><button id="exportBundleBtn" class="btn primary">⬇ Export Training Bundle</button><button id="importBundleBtn" class="btn ghost">⬆ Import Training Bundle</button><input id="importBundleInput" type="file" accept="application/json,.json" hidden></div>\n        <p class="note"><b>Portable training:</b> the bundle keeps your cumulative recorded samples and, when available, the trained model. Import it on another device to continue from the same training instead of starting over.</p>'''
          rep(old_note,new_note,'portable controls')

          rep('const SEQ=24, FEAT=126;', 'const SEQ=24, FEAT=126, PORTABLE_BUNDLE_VERSION=1;', 'bundle version')

          old_mark='''function markDatasetChanged(){
 localStorage.setItem("svx-data",JSON.stringify(dataset));
 $("trainText").textContent="Dataset changed — retrain AI.";
 $("modelStatus").textContent="● Retrain needed";
 $("modelStatus").classList.remove("on");
}'''
          new_mark='''function markDatasetChanged(){
 try{localStorage.setItem("svx-data",JSON.stringify(dataset));}
 catch(e){alert("This browser storage is full. Export a Training Bundle before recording more samples.");throw e}
 const signCount=new Set(dataset.map(x=>x.label)).size;
 if(model&&labels.length){
   $("trainText").textContent="Saved "+dataset.length+" cumulative samples across "+signCount+" signs. Previous trained AI is kept until updated training succeeds.";
   $("modelStatus").textContent="● Previous AI active • update pending";
   $("modelStatus").classList.add("on");
 }else{
   $("trainText").textContent="Saved "+dataset.length+" cumulative samples across "+signCount+" signs — train AI when ready.";
   $("modelStatus").textContent="● Retrain needed";
   $("modelStatus").classList.remove("on");
 }
}'''
          rep(old_mark,new_mark,'dataset persistence')

          old_item='''const item={participant:$("participant").value.trim()||"P001",label:$("label").value.trim().toUpperCase()||"SIGN",seq:recordFrames.slice(0,SEQ)};'''
          new_item='''const item={id:(crypto.randomUUID?crypto.randomUUID():(Date.now()+"-"+Math.random().toString(36).slice(2))),createdAt:new Date().toISOString(),participant:$("participant").value.trim()||"P001",label:$("label").value.trim().toUpperCase()||"SIGN",seq:recordFrames.slice(0,SEQ)};'''
          rep(old_item,new_item,'sample identity')

          old_eval='''async function evaluate(items){
 if(!items.length)return null;
 const t=tensors(items,labels),pred=model.predict(t.x);
 const pi=pred.argMax(-1), yi=t.y.argMax(-1);
 const pv=Array.from(await pi.data()), yv=Array.from(await yi.data());
 let correct=0;yv.forEach((v,i)=>{if(v===pv[i])correct++});
 t.x.dispose();t.y.dispose();pred.dispose();pi.dispose();yi.dispose();
 return correct/yv.length;
}'''
          new_eval='''async function evaluate(items,targetModel=model,targetLabels=labels){
 if(!items.length)return null;
 const t=tensors(items,targetLabels),pred=targetModel.predict(t.x);
 const pi=pred.argMax(-1), yi=t.y.argMax(-1);
 const pv=Array.from(await pi.data()), yv=Array.from(await yi.data());
 let correct=0;yv.forEach((v,i)=>{if(v===pv[i])correct++});
 t.x.dispose();t.y.dispose();pred.dispose();pi.dispose();yi.dispose();
 return correct/yv.length;
}'''
          rep(old_eval,new_eval,'candidate evaluation')

          portable_js=r'''function sampleIsValid(s){
 return !!s && typeof s==="object" && typeof s.label==="string" && Array.isArray(s.seq) && s.seq.length===SEQ && s.seq.every(f=>Array.isArray(f)&&f.length===FEAT&&f.every(v=>Number.isFinite(Number(v))));
}
function sampleFingerprint(s){return JSON.stringify([s.participant||"",s.label||"",s.seq]);}
function bufferToBase64(buffer){
 const bytes=new Uint8Array(buffer||new ArrayBuffer(0));let out="";const step=0x8000;
 for(let i=0;i<bytes.length;i+=step)out+=String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length)));
 return btoa(out);
}
function base64ToBuffer(text){
 const bin=atob(text||"");const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return bytes.buffer;
}
async function capturePortableModel(){
 if(!model||!labels.length)return null;
 let captured=null;
 await model.save(tf.io.withSaveHandler(async artifacts=>{
   captured=artifacts;
   return {modelArtifactsInfo:{dateSaved:new Date(),modelTopologyType:"JSON",modelTopologyBytes:JSON.stringify(artifacts.modelTopology||{}).length,weightSpecsBytes:JSON.stringify(artifacts.weightSpecs||[]).length,weightDataBytes:artifacts.weightData?artifacts.weightData.byteLength:0}};
 }));
 if(!captured)return null;
 return {modelTopology:captured.modelTopology,weightSpecs:captured.weightSpecs||[],weightDataBase64:bufferToBase64(captured.weightData),format:captured.format||null,generatedBy:captured.generatedBy||null,convertedBy:captured.convertedBy||null,trainingConfig:captured.trainingConfig||null,userDefinedMetadata:captured.userDefinedMetadata||null};
}
async function exportTrainingBundle(){
 try{
   $("exportBundleBtn").disabled=true;
   const portableModel=await capturePortableModel().catch(e=>{console.warn("Model export skipped",e);return null});
   let history=[];try{history=JSON.parse(localStorage.getItem("svx-training-history")||"[]")}catch(_){history=[]}
   const bundle={kind:"SilentVoiceXTrainingBundle",version:PORTABLE_BUNDLE_VERSION,exportedAt:new Date().toISOString(),seq:SEQ,feat:FEAT,dataset,trainedLabels:labels,threshold:parseFloat($("threshold").value)||.75,history,model:portableModel};
   const blob=new Blob([JSON.stringify(bundle)],{type:"application/json"});
   const url=URL.createObjectURL(blob),a=document.createElement("a");
   a.href=url;a.download="SilentVoiceX-training-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
   $("trainText").textContent="✓ Portable training bundle exported: "+dataset.length+" samples, "+new Set(dataset.map(x=>x.label)).size+" signs"+(portableModel?" + trained model":"")+".";
 }catch(e){alert("Could not export training bundle: "+e.message)}finally{$("exportBundleBtn").disabled=false;}
}
async function restorePortableModel(bundle){
 if(!bundle.model||!Array.isArray(bundle.trainedLabels)||!bundle.trainedLabels.length)return false;
 const m=bundle.model;
 const artifacts={modelTopology:m.modelTopology,weightSpecs:m.weightSpecs||[],weightData:base64ToBuffer(m.weightDataBase64||"")};
 if(m.format)artifacts.format=m.format;if(m.generatedBy)artifacts.generatedBy=m.generatedBy;if(m.convertedBy)artifacts.convertedBy=m.convertedBy;if(m.trainingConfig)artifacts.trainingConfig=m.trainingConfig;if(m.userDefinedMetadata)artifacts.userDefinedMetadata=m.userDefinedMetadata;
 const imported=await tf.loadLayersModel(tf.io.fromMemory(artifacts));
 const units=Number(imported.layers[imported.layers.length-1]?.units||0);
 if(units&&units!==bundle.trainedLabels.length){imported.dispose();throw new Error("Portable model label count does not match its output layer.")}
 await imported.save("indexeddb://silentvoice-x");
 if(model)model.dispose();
 model=imported;labels=bundle.trainedLabels.map(x=>String(x).toUpperCase());
 localStorage.setItem("svx-labels",JSON.stringify(labels));
 $("modelStatus").textContent="● Portable AI restored ("+labels.length+" signs)";$("modelStatus").classList.add("on");
 $("word").textContent="READY";$("conf").textContent="Portable AI restored — start camera";
 return true;
}
async function importTrainingBundle(file){
 if(!file)return;
 try{
   const bundle=JSON.parse(await file.text());
   if(bundle.kind!=="SilentVoiceXTrainingBundle")throw new Error("This is not a SilentVoiceX training bundle.");
   if(Number(bundle.seq)!==SEQ||Number(bundle.feat)!==FEAT)throw new Error("This bundle uses an incompatible landmark format.");
   const incoming=(Array.isArray(bundle.dataset)?bundle.dataset:[]).filter(sampleIsValid).map(s=>({...s,label:String(s.label).trim().toUpperCase(),participant:String(s.participant||"P001")}));
   if(!incoming.length)throw new Error("No valid training samples were found in the bundle.");
   const existing=new Set(dataset.filter(sampleIsValid).map(sampleFingerprint));
   let added=0;
   for(const s of incoming){const k=sampleFingerprint(s);if(!existing.has(k)){dataset.push(s);existing.add(k);added++;}}
   localStorage.setItem("svx-data",JSON.stringify(dataset));
   if(Array.isArray(bundle.history))localStorage.setItem("svx-training-history",JSON.stringify(bundle.history.slice(0,20)));
   if(Number.isFinite(Number(bundle.threshold)))$("threshold").value=String(bundle.threshold);
   selectedRecordIndexes.clear();logSamples();
   const localSet=new Set(dataset.filter(sampleIsValid).map(sampleFingerprint));
   const bundleSet=new Set(incoming.map(sampleFingerprint));
   const exactSame=localSet.size===bundleSet.size&&[...localSet].every(x=>bundleSet.has(x));
   let restored=false;
   if(exactSame&&bundle.model){try{restored=await restorePortableModel(bundle)}catch(e){console.warn("Portable model restore failed",e)}}
   if(!restored)markDatasetChanged();
   alert("Imported "+added+" new training sample"+(added===1?"":"s")+". Total: "+dataset.length+" samples across "+new Set(dataset.map(x=>x.label)).size+" signs."+(restored?" The trained model was restored too.":" Your previous AI is kept; tap TRAIN SILENTVOICE X to rebuild using the combined old + new data."));
 }catch(e){alert("Could not import training bundle: "+e.message)}finally{$("importBundleInput").value="";}
}
$("exportBundleBtn").onclick=exportTrainingBundle;
$("importBundleBtn").onclick=()=>$("importBundleInput").click();
$("importBundleInput").onchange=e=>importTrainingBundle(e.target.files?.[0]);
'''
          marker='function buildModel(n){'
          if marker not in s: raise SystemExit('Missing buildModel marker')
          s=s.replace(marker,portable_js+'\n'+marker,1)

          start=s.index('$("trainBtn").onclick=async()=>{')
          end=s.index('async function loadSaved()',start)
          train=r'''$("trainBtn").onclick=async()=>{
 let T=null,V=null,candidate=null;
 try{
   const nextLabels=[...new Set(dataset.filter(sampleIsValid).map(x=>x.label))].sort();
   if(nextLabels.length<2){alert("Record at least 2 different sign labels first.");return}
   const counts=Object.fromEntries(nextLabels.map(l=>[l,dataset.filter(x=>sampleIsValid(x)&&x.label===l).length]));
   if(Math.min(...Object.values(counts))<4){alert("Collect at least 4 samples for every sign before training.");return}
   const hold=$("holdout").value.trim();
   const validData=dataset.filter(sampleIsValid);
   const trainAll=validData.filter(x=>x.participant!==hold);
   const test=validData.filter(x=>x.participant===hold);
   const trainLabels=new Set(trainAll.map(x=>x.label));
   const testLabels=new Set(test.map(x=>x.label));
   const missingTrain=nextLabels.filter(l=>!trainLabels.has(l));
   const missingTest=nextLabels.filter(l=>!testLabels.has(l));
   if(missingTrain.length){alert("Training cannot start yet. These signs exist only in the held-out participant: "+missingTrain.join(", ")+". Record them with a training participant too.");return}
   const perLabelTrain=Object.fromEntries(nextLabels.map(l=>[l,trainAll.filter(x=>x.label===l).length]));
   if(Math.min(...Object.values(perLabelTrain))<4){alert("Each sign needs at least 4 training samples outside the hold-out participant.");return}

   $("trainText").textContent="Building updated AI from all "+trainAll.length+" cumulative training samples…";
   $("bar").style.width="1%";
   await tf.ready();
   try{if(tf.getBackend()!=="cpu"){await tf.setBackend("cpu");await tf.ready();}}catch(e){console.warn("Backend switch skipped",e)}
   const shuffled=trainAll.slice();tf.util.shuffle(shuffled);
   const tr=[],va=[];
   for(const l of nextLabels){const items=shuffled.filter(x=>x.label===l);const nVal=Math.max(1,Math.floor(items.length*.2));va.push(...items.slice(0,nVal));tr.push(...items.slice(nVal));}
   candidate=buildModel(nextLabels.length);
   T=tensors(tr,nextLabels);V=tensors(va,nextLabels);
   $("trainBtn").disabled=true;$("bar").style.width="1%";$("resultsLog").textContent="Training updated cumulative model…";await tf.nextFrame();
   const EPOCHS=15;
   await candidate.fit(T.x,T.y,{epochs:EPOCHS,batchSize:Math.min(6,tr.length),validationData:[V.x,V.y],shuffle:true,callbacks:{onTrainBegin:async()=>{$("trainText").textContent="Training updated AI…";await tf.nextFrame()},onEpochEnd:async(e,l)=>{const acc=(l.acc??l.accuracy??0)*100,vacc=(l.val_acc??l.val_accuracy??0)*100;$("bar").style.width=((e+1)/EPOCHS*100)+"%";$("trainText").textContent="Epoch "+(e+1)+"/"+EPOCHS+" • accuracy "+acc.toFixed(1)+"% • validation "+vacc.toFixed(1)+"%";await tf.nextFrame()}}});

   const val=await evaluate(va,candidate,nextLabels),held=await evaluate(test,candidate,nextLabels);
   if(model&&labels.length){try{await model.save("indexeddb://silentvoice-x-previous");localStorage.setItem("svx-previous-labels",JSON.stringify(labels));}catch(e){console.warn("Previous AI snapshot skipped",e)}}
   await candidate.save("indexeddb://silentvoice-x");
   if(model)model.dispose();
   model=candidate;candidate=null;labels=nextLabels;
   localStorage.setItem("svx-labels",JSON.stringify(labels));
   let history=[];try{history=JSON.parse(localStorage.getItem("svx-training-history")||"[]")}catch(_){history=[]}
   history.unshift({trainedAt:new Date().toISOString(),samples:validData.length,trainingSamples:tr.length,validationSamples:va.length,labels:[...labels],validationAccuracy:val,holdoutParticipant:hold||null,holdoutSamples:test.length,holdoutAccuracy:held,holdoutMissingSigns:missingTest});
   localStorage.setItem("svx-training-history",JSON.stringify(history.slice(0,20)));
   $("valAcc").textContent=val==null?"—":(val*100).toFixed(1)+"%";
   $("holdAcc").textContent=held==null?"No data":(held*100).toFixed(1)+"%";
   const coverage=missingTest.length?"\nHold-out coverage is PARTIAL; missing signs: "+missingTest.join(", "):"\nHold-out coverage includes all trained signs.";
   $("resultsLog").textContent="Classes: "+labels.join(", ")+"\nCumulative samples: "+validData.length+"\nTrain samples: "+tr.length+"\nValidation samples: "+va.length+"\nHeld-out signer: "+(hold||"not used")+" ("+test.length+" samples)"+coverage+"\nFinal validation accuracy: "+(val==null?"not measured":(val*100).toFixed(1)+"%")+"\nUnseen-signer accuracy: "+(held==null?"not measured":(held*100).toFixed(1)+"%");
   $("modelStatus").textContent="● AI trained • "+labels.length+" signs";$("modelStatus").classList.add("on");$("word").textContent="READY";$("conf").textContent="Updated AI trained — old + new signs saved";
   $("trainText").textContent="✓ Updated training complete • previous samples preserved • "+labels.length+" signs";
 }catch(e){
   console.error(e);if(candidate){try{candidate.dispose()}catch(_){}}
   $("trainText").textContent="Update failed — previous trained AI was kept. "+e.message;
   $("resultsLog").textContent="Updated training failed: "+e.message+"\nPrevious saved model remains available.";
   if(model&&labels.length){$("modelStatus").textContent="● Previous AI still active";$("modelStatus").classList.add("on")}
   alert("Updated training stopped: "+e.message+"\nYour previous trained AI has NOT been deleted.");
 }finally{
   $("trainBtn").disabled=false;if(T){T.x.dispose();T.y.dispose()}if(V){V.x.dispose();V.y.dispose()}
 }
};
'''
          s=s[:start]+train+s[end:]

          # Build 15 architecture remains unchanged.
          assert 'BUILD 15 • AUTO SPEAK 80%' in s
          assert 'filters:16,kernelSize:3' in s and 'filters:24,kernelSize:3' in s
          assert 'const EPOCHS=15;' in s
          assert 'Export Training Bundle' in s and 'Import Training Bundle' in s
          assert 'silentvoice-x-previous' in s
          p.write_text(s)

          sw=Path('sw.js')
          sws=sw.read_text().replace("silentvoicex-build15-safe-v2","silentvoicex-build15-portable-v3")
          sw.write_text(sws)
          PY

      - name: Validate browser code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          js=js.replace('import {HandLandmarker, FilesetResolver, DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";','const HandLandmarker={}, FilesetResolver={}, DrawingUtils=function(){};')
          Path('/tmp/app.mjs').write_text(js)
          PY
          node --check /tmp/app.mjs
          grep -q 'silentvoicex-build15-portable-v3' sw.js
          grep -q 'Previous AI active' index.html
          grep -q 'Portable training' index.html
      - name: Commit portable cumulative build
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Add portable cumulative training without losing previous AI'
          git push
