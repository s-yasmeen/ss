name: Fix training and autospeak 70
on:
  push:
    paths:
      - '.github/workflows/run-fix-training-and-autospeak70.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply repair
        run: python scripts/fix-training-and-autospeak70.py
      - name: Validate browser module and backend syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          js=js.replace('import {HandLandmarker, FilesetResolver, DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";','const HandLandmarker={}, FilesetResolver={}, DrawingUtils=function(){};')
          Path('/tmp/app.mjs').write_text(js)
          PY
          node --check /tmp/app.mjs
          node --check sync-backend/server.js
          grep -q 'trainingBusy=false' index.html
          grep -q 'conf>=0.70' index.html
          grep -q 'BUILD 15 • AUTO SPEAK 70%' index.html
          grep -q 'const EPOCHS=15;' index.html
      - name: Commit repaired app
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sync-backend/server.js
          git commit -m 'Fix training startup and preserve shared model at 70 percent autospeak'
          git push
