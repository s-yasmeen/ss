name: Fix saved training restore

on:
  push:
    paths:
      - '.github/workflows/fix-training-restore.yml'
      - 'scripts/fix_training_restore.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply training recovery patch
        run: python scripts/fix_training_restore.py
      - name: Validate browser module syntax
        run: node --check /tmp/svx-restore.mjs
      - name: Commit restored training loader
        run: |
          git config user.name "SilentVoiceX Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Restore saved training detection after rollback" || exit 0
          git push
