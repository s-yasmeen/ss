name: Add multi record delete

on:
  push:
    paths:
      - '.github/workflows/add-multi-record-delete.yml'
      - 'scripts/add_multi_record_delete.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add single and multi-record deletion controls
        run: python scripts/add_multi_record_delete.py
      - name: Validate browser module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script type="module">(.*?)</script>', s, re.S)
          if len(scripts)!=1:
              raise SystemExit('Expected one module script')
          Path('/tmp/svx-app.mjs').write_text(scripts[0])
          PY
          node --check /tmp/svx-app.mjs
      - name: Commit record deletion controls
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Add single and multi-record deletion' || exit 0
          git push
