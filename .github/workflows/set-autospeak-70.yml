name: Set auto speak 70 percent

on:
  push:
    paths:
      - 'scripts/set-autospeak-70.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply auto speak threshold
        run: python scripts/set-autospeak-70.py
      - name: Validate JavaScript and Build 15 invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script type="module">',1)[1].split('</script>',1)[0]
          js=js.replace('import {HandLandmarker, FilesetResolver, DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";','const HandLandmarker={}, FilesetResolver={}, DrawingUtils=function(){};')
          Path('/tmp/app.mjs').write_text(js)
          assert 'BUILD 15 • AUTO SPEAK 70%' in s
          assert 'conf>=0.70' in s
          assert 'conf<0.60' in s
          assert 'const EPOCHS=15;' in s
          PY
          node --check /tmp/app.mjs
      - name: Commit change
        run: |
          git config user.name 'SilentVoiceX Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Set Build 15 auto-speak threshold to 70 percent'
          git push
